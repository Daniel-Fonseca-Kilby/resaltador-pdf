# PAUSADO (2026-09-11): esta config quedo desactivada en el servidor -el
# firewall corporativo de VMA (Fortinet) bloquea sslip.io por categoria
# "Dynamic DNS", asi que el certificado emitido para 37-27-13-61.sslip.io
# no sirve para el uso real. Se volvio a HTTP simple (gunicorn en
# 0.0.0.0:8000, sin Nginx) mientras VMA consigue un dominio propio. Este
# archivo queda como referencia para cuando eso pase -solo hay que cambiar
# server_name por el dominio real y repetir los pasos de "certbot --nginx".
#
# Configuracion de Nginx como reverse proxy delante de Gunicorn.
#
# Gunicorn escucha solo en 127.0.0.1:8000 (ver resaltador-pdf.service);
# Nginx es quien recibe el trafico publico y lo reenvia. certbot (con el
# plugin de Nginx) agrega automaticamente el bloque HTTPS (listen 443,
# certificados, redireccion desde el 80) la primera vez que se corre -no
# hace falta escribirlo a mano aca.
#
# Instalar en el servidor como /etc/nginx/sites-available/resaltador-pdf
# y habilitar con un symlink en sites-enabled (ver README de deploy/).
#
# server_name usa un dominio de sslip.io (DNS publico gratuito que resuelve
# "<ip-con-guiones>.sslip.io" a esa misma IP) porque el servidor no tiene
# un dominio propio todavia -Let's Encrypt no emite certificados para una
# IP directa. Si mas adelante VMA consigue un dominio propio, solo hay que
# cambiar este valor y volver a correr certbot.

server {
    listen 80;
    server_name 37-27-13-61.sslip.io;

    # mismo limite que MAX_CONTENT_LENGTH en api/index.py -si no coinciden,
    # Nginx rechaza el archivo grande antes de que Flask pueda devolver su
    # propio mensaje de error en espanol.
    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # planillas grandes pueden tardar varios minutos -mismo valor que
        # el --timeout de gunicorn en resaltador-pdf.service.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
